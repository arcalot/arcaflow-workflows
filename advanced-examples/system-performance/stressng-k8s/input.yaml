# This is a sample input file for the workflow
run_id: example_run_id
pcp_pmlogger_interval: 1.0
stressng_params:
  timeout: 10
  stressors:
    - stressor: cpu
      workers: 1
    - stressor: vm
      workers: 1
      vm-bytes: 1G
    - stressor: mmap
      workers: 1
      mmap-bytes: 1G
k8s_namespace: default
kubeconfig: |
  <kubeconfig as a multi-line string>
